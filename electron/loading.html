<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starting Vocalis</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1120; color: #eef2ff; }
    main { text-align: center; }
    .mark { font-size: 48px; color: #8b5cf6; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { color: #a8b2cc; }
    .spinner { width: 28px; height: 28px; margin: 28px auto 0; border: 3px solid #263454; border-top-color: #8b5cf6; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body><main><div class="mark">◒</div><h1>Starting Vocalis</h1><p>Loading your local TTS engine…</p><div class="spinner" aria-label="Loading"></div></main></body>
</html>
